packages:
  - .

# pnpm 10 reads onlyBuiltDependencies; pnpm 11 reads allowBuilds.
# Keep both so the build approves these scripts on either version.
onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver
  - workerd

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true
